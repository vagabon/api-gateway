server:
  port: 8080
  servlet:
    context-path: /

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  mongodb:
    uri: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}/${MONGO_DB}?authSource=admin

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "gateway:"
      use-key-prefix: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: blog
              uri: ${BLOG_URI:http://localhost:8085}
              predicates:
                - Path=/blog/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Authorization
                - RemoveRequestHeader=Origin

  devtools:
    restart:
      enabled: true
      additional-paths:
        - ../auth/auth-domain/target/classes
        - ../auth/auth-infrastructure/target/classes
        - ../base/base-domain/target/classes
        - ../base/base-infrastructure/target/classes

google:
  client-id: ${GOOGLE_CLIENT_ID}

app:
  jwt:
    issuer: ${JWT_ISSUER:api-gateway}
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_TTL:1m}
  refresh-cookie:
    name: ${REFRESH_COOKIE_NAME:refresh_token}
    endpoint: ${REFRESH_COOKIE_ENDPOINT:/v1/auth}
    ttl: ${REFRESH_COOKIE_TTL:604800}

  endpoint:
    permit: ${ENDPOINT_PERMIT:/v1/auth/**}

  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET POST PUT PATCH DELETE OPTIONS}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.boot.autoconfigure.flyway: ERROR
    org.flywaydb: ERROR
    org.springframework.orm.jpa: ERROR
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
