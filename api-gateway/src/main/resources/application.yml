server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #           scope:
  #             - email
  #             - profile

  devtools:
    restart:
      enabled: true
      additional-paths:
        - ../auth/auth-domain/target/classes
        - ../auth/auth-infrastructure/target/classes
        - ../base/base-domain/target/classes
        - ../base/base-infrastructure/target/classes

logging:
  level:
    org.springframework.boot.autoconfigure.flyway: ERROR
    org.flywaydb: ERROR
    org.springframework.orm.jpa: ERROR
