server:
  port: 8080

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "gateway:"
      use-key-prefix: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: blog
              uri: ${BLOG_URI:http://localhost:8085}
              predicates:
                - Path=/blog/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Authorization

  devtools:
    restart:
      enabled: true
      additional-paths:
        - ../auth/auth-domain/target/classes
        - ../auth/auth-infrastructure/target/classes
        - ../base/base-domain/target/classes
        - ../base/base-infrastructure/target/classes

google:
  client-id: ${GOOGLE_CLIENT_ID}

jwt:
  issuer: ${JWT_ISSUER:api-gateway}
  secret: ${JWT_SECRET}
  access-ttl: ${JWT_TTL:1m}
  refresh-ttl: ${JWT_REFRESH_TTL:604800}

app:
  refresh-cookie.name: "refresh_token"
  cors:
    origins: ${CORS_ORIGINS:https://localhost:4200}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET POST PUT PATCH DELETE OPTIONS}

logging:
  level:
    org.springframework.boot.autoconfigure.flyway: ERROR
    org.flywaydb: ERROR
    org.springframework.orm.jpa: ERROR
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
