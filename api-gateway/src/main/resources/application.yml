server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  devtools:
    restart:
      enabled: true
      additional-paths:
        - ../auth/auth-domain/target/classes
        - ../auth/auth-infrastructure/target/classes
        - ../base/base-domain/target/classes
        - ../base/base-infrastructure/target/classes

google:
  client-id: ${GOOGLE_CLIENT_ID}

jwt:
  issuer: ${JWT_ISSUER:api-gateway}
  secret: ${JWT_SECRET}
  access-ttl: ${JWT_TTL:1m}
  refresh-ttl: ${JWT_REFRESH_TTL:604800}

app:
  refresh-cookie.name: "refresh_token"

logging:
  level:
    org.springframework.boot.autoconfigure.flyway: ERROR
    org.flywaydb: ERROR
    org.springframework.orm.jpa: ERROR
