# 1. Exclusion des sous-modules du classpath de base pour qu'ils ne soient pas considérés comme du code tiers figé
restart.exclude.auth-domain=auth-domain-.*\.jar
restart.exclude.auth-infra=auth-infrastructure-.*\.jar

# 2. Inclusion explicite des dossiers de classes compilées pour qu'ils déclenchent le redémarrage du contexte
restart.include.auth-domain=.*auth-domain/target/classes/.*
restart.include.auth-infra=.*auth-infrastructure/target/classes/.*